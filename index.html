        function renderGames(list) {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = list.map((game, index) => `
                <div class="game-card glass-panel rounded-3xl overflow-hidden cursor-pointer group relative" onclick="openGenerator('${game.slug}')" style="animation-delay: ${index * 0.05}s">
                    <div class="h-48 overflow-hidden relative">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#0f0518] via-transparent to-transparent opacity-80 z-10"></div>

                        <div class="absolute top-3 right-3 z-20 bg-black/50 backdrop-blur-md px-2 py-1 rounded-lg border border-white/10">

                    <div class="p-6 relative z-20">
                        <h3 class="text-lg font-black text-white mb-1 uppercase tracking-tighter truncate">${game.title}</h3>

        function initRouter() {
            let query = window.location.search.substring(1); 
            if(query.includes('&')) query = query.split('&')[0];
            query = query.toLowerCase();

            if (query) {
                const match = GAMES.find(g => g.slug === query);
                if (match) openGenerator(match.slug, false);
            }
        }

        function openGenerator(slug, updateUrl = true) {
            selectedGame = GAMES.find(g => g.slug === slug);
            selectedPlatform = null;
            if (updateUrl && selectedGame) window.history.pushState({slug: slug}, "", "?" + selectedGame.slug);
            
            document.getElementById('gen-title').innerText = selectedGame.title;
            document.getElementById('gen-image').src = selectedGame.img;
            document.getElementById('gen-title-mob').innerText = selectedGame.title;
            document.getElementById('gen-image-mob').src = selectedGame.img;
            
            document.getElementById('step-1').classList.remove('hidden');
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('username-input').value = "";
            
            document.querySelectorAll('.platform-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById('platform-error').classList.add('hidden');

            const usernameField = document.getElementById('username-field');
            const platformField = document.getElementById('platform-field');
            const btnSpan = document.querySelector('#injection-btn span');
            
            // إظهار/إخفاء الحقول حسب اللعبة
            if (slug === 'tocaboca' || slug === 'speedstars') {
                usernameField.classList.add('hidden');
            } else {
                usernameField.classList.remove('hidden');
            }
            
            if (slug === 'roblox' || slug === 'bloxfruits') {
                platformField.classList.add('hidden');
                // لا حاجة للتحقق من platform لهذه الألعاب
            } else {
                platformField.classList.remove('hidden');
            }
            
            // تعديل نص الزر
            if (slug === 'tocaboca') {
                btnSpan.innerText = "UNLOCK NOW";
            } else if (slug === 'speedstars') {
                btnSpan.innerText = "GET THE BUILD";
            } else {
                btnSpan.innerText = "START INJECTION";
            }
            
            document.getElementById('amount-grid').innerHTML = selectedGame.rewards.map((r, i) => `
                <button onclick="selectAmount(this, '${r}')" class="option-btn p-4 rounded-xl flex items-center justify-between group ${i===0?'active':''}">
                    <span class="text-xs font-bold uppercase">${r}</span>
                    <div class="w-4 h-4 rounded-full border border-white/20 group-[.active]:bg-violet-500 group-[.active]:border-violet-500 flex items-center justify-center">
                        <svg class="w-2.5 h-2.5 text-black opacity-0 group-[.active]:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"/></svg>
                    </div>
                </button>
            `).join('');
            selectedAmount = selectedGame.rewards[0];

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-generator').classList.remove('hidden');
            
            startFakeComments();
            startToastNotifications(); 
            window.scrollTo(0,0);
        }

        function selectAmount(btn, val) {
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedAmount = val;
        }

        function selectPlatform(btn) {
            document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedPlatform = btn.textContent.trim();
            document.getElementById('platform-error').classList.add('hidden');
        }

        function validateAndStart() {
            // تحقق فقط إذا كانت المنصة مطلوبة (أي حقل المنصة ظاهر)
            const platformField = document.getElementById('platform-field');
            if (!platformField.classList.contains('hidden') && !selectedPlatform) {
                document.getElementById('platform-error').classList.remove('hidden');
                document.getElementById('platform-error').scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
            
            // تحقق من اسم المستخدم إذا كان الحقل ظاهراً
            const usernameField = document.getElementById('username-field');
            if (!usernameField.classList.contains('hidden')) {
                const username = document.getElementById('username-input').value.trim();
                if(!username) { 
                    document.getElementById('username-input').focus();
                    showToastMessage("Please enter your username!", "error");
                    return; 
                }
            }
            
            startGenerator();
        }

        async function startGenerator() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            
            const logsDiv = document.getElementById('console-logs');
            logsDiv.innerHTML = "";
            
            let logs = [];
            if (selectedGame.slug === 'tocaboca') {
                logs = [
                    `Connecting to Toca Boca Database...`, "Handshake successful.",
                    "Bypassing Security System...", "Access Granted.",
                    `Unlocking ${selectedAmount}...`, "Injecting Premium Assets...",
                    "Unlock Process: 100%...", "Finalizing Installation..."
                ];
            } else {
                logs = [
                    `Connecting to ${selectedGame.title} Server...`, "Handshake successful.",
                    `Authenticating User...`, "User Verified.",
                    `Injecting ${selectedAmount}...`, "Bypassing Anti-Cheat...",
                    "Injection: 100%...", "Finalizing..."
                ];
            }
            
            for(let log of logs) {
                logsDiv.innerHTML += `<div class="terminal-text">> ${log}</div>`;
                logsDiv.scrollTop = logsDiv.scrollHeight;
                await new Promise(r => setTimeout(r, 800));
            }
            
            addNewComment();
            
            setTimeout(() => {
                showLocker();
            }, 5000);
        }

        function showLocker() {
            const gameSlug = selectedGame.slug;
            const lockerUrl = LOCKER_LINKS[gameSlug] || LOCKER_LINKS['default'];
            
            // تعيين الرابط للإطار
            document.getElementById('locker-iframe').src = lockerUrl;
            
            // إظهار الـ overlay
            document.getElementById('locker-overlay').classList.add('active');
        }

        function closeLocker(event) {
            // إخفاء الـ overlay
            document.getElementById('locker-overlay').classList.remove('active');
            // إفراغ محتوى الإطار لإيقاف أي صوت أو نشاط في الخلفية
            setTimeout(() => {
                document.getElementById('locker-iframe').src = 'about:blank';
            }, 300);
        }

        function showToastMessage(message, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === "error" ? "bg-red-500/20 border-red-500/50" : 
                          type === "success" ? "bg-green-500/20 border-green-500/50" : 
                          "bg-violet-500/20 border-violet-500/50";
            
            const textColor = type === "error" ? "text-red-300" : 
                            type === "success" ? "text-green-300" : 
                            "text-violet-300";
            
            toast.className = `toast-notification flex items-center gap-3 p-3 rounded-xl min-w-[250px] animate__animated animate__fadeInDown ${bgColor}`;
            toast.innerHTML = `
                <div class="w-8 h-8 rounded-full ${type === "error" ? "bg-red-500/20" : type === "success" ? "bg-green-500/20" : "bg-violet-500/20"} flex items-center justify-center">
                    ${type === "error" ? '<svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>' : 
                     type === "success" ? '<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : 
                     '<svg class="w-5 h-5 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'}
                </div>
                <div>
                    <p class="${textColor} text-xs font-bold">${message}</p>
                </div>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('animate__fadeInDown');
                toast.classList.add('animate__fadeOutUp');
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        function addNewComment() {
            const name = NAMES[Math.floor(Math.random() * NAMES.length)];
            const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
            const list = document.getElementById('comments-list');
            
            const div = document.createElement('div');
            div.className = "flex items-start gap-3 animate__animated animate__fadeInUp";
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center font-bold text-xs text-slate-400 border border-white/5">${name[0]}</div>
                <div class="flex-1">
                    <div class="flex justify-between items-center mb-0.5"><span class="text-xs font-bold text-white">${name}</span><span class="text-[9px] text-green-500 font-mono">JUST NOW</span></div>
                    <p class="text-[10px] text-slate-400">${msg}</p>
                </div>`;
            list.prepend(div);
            if(list.children.length > 4) list.lastChild.remove();
        }

        function startFakeComments() {
            const list = document.getElementById('comments-list');
            list.innerHTML = "";
            function add() {
                const name = NAMES[Math.floor(Math.random() * NAMES.length)];
                const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
                const div = document.createElement('div');
                div.className = "flex items-start gap-3 animate__animated animate__fadeInUp";
                div.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center font-bold text-xs text-slate-400 border border-white/5">${name[0]}</div>
                    <div class="flex-1">
                        <div class="flex justify-between items-center mb-0.5"><span class="text-xs font-bold text-white">${name}</span><span class="text-[9px] text-violet-500 font-mono">VERIFIED</span></div>
                        <p class="text-[10px] text-slate-400">${msg}</p>
                    </div>`;
                list.prepend(div);
                if(list.children.length > 4) list.lastChild.remove();
            }
            for(let i=0; i<3; i++) add();
            if(window.comInt) clearInterval(window.comInt);
            window.comInt = setInterval(add, 2500);
        }

        function startToastNotifications() {
            if(window.toastInt) clearInterval(window.toastInt);
            
            function showToast() {
                if(!selectedGame) return;
                const container = document.getElementById('toast-container');
                const name = NAMES[Math.floor(Math.random() * NAMES.length)];
                const reward = selectedGame.rewards[Math.floor(Math.random() * selectedGame.rewards.length)];
                
                const toast = document.createElement('div');
                toast.className = "toast-notification flex items-center gap-3 p-3 rounded-xl min-w-[250px] animate__animated animate__fadeInDown";
                toast.innerHTML = `
                    <img src="${selectedGame.img}" class="w-8 h-8 rounded-lg object-cover">
                    <div>
                        <p class="text-[10px] text-slate-400 font-bold">${name} received:</p>
                        <p class="text-xs font-black text-white text-shadow">${reward}</p>
                    </div>
                `;
                
                container.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.remove('animate__fadeInDown');
                    toast.classList.add('animate__fadeOutUp');
                    setTimeout(() => toast.remove(), 500);
                }, 4000);
            }

            window.toastInt = setInterval(showToast, 5000);
            setTimeout(showToast, 1000);
        }

        function showHome() {
            window.history.pushState({}, "", window.location.pathname);
            document.getElementById('view-home').classList.remove('hidden');
            document.getElementById('view-generator').classList.add('hidden');
            if(window.toastInt) clearInterval(window.toastInt);
            document.getElementById('toast-container').innerHTML = "";
            if(window.comInt) clearInterval(window.comInt);
            
            // إغلاق اللوكر إذا كان مفتوحاً
            closeLocker();
        }

        function filterGames() {
            const term = document.getElementById('search-input').value.toLowerCase();
            renderGames(GAMES.filter(g => g.title.toLowerCase().includes(term)));
        }

        setInterval(() => {
            let el = document.getElementById('online-count');
            let current = parseInt(el.innerText.replace(/,/g, ''));
            let newCount = current + (Math.floor(Math.random() * 300) - 150);
            if (newCount < 100000) newCount = 100000;
            el.innerText = newCount.toLocaleString();
        }, 2000);

        function showCookieNotice() {
            if (!localStorage.getItem('cookiesAccepted')) {
                setTimeout(() => {
                    document.getElementById('cookie-notice').classList.remove('hidden');
                }, 2000);
            }
        }

        function acceptCookies() {
            localStorage.setItem('cookiesAccepted', 'true');
            const notice = document.getElementById('cookie-notice');
            notice.classList.add('hide');
            setTimeout(() => {
                notice.classList.add('hidden');
                notice.classList.remove('hide');
            }, 500);
        }

        renderGames(GAMES);
        initRouter();
        showCookieNotice();
    </script>
